<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120b08">
<!-- Ottimizzazioni PWA per Android -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AliceMusic">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AliceMusic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dust" id="dust"></div>

<div class="app">

  <header class="header">
    <div class="watch" aria-hidden="true"></div>
    <div class="brand">
      <h1>AliceMusic</h1>
      <span>per Alice ✨ edizione Grifondoro</span>
    </div>
  </header>

  <div class="tabbar">
    <button class="tabbtn active" id="tabSearchBtn" type="button">🔍 Cerca</button>
    <button class="tabbtn" id="tabHistoryBtn" type="button">📜 Cronologia</button>
  </div>

  <section id="searchView">
    <form class="search-wrap" id="searchForm" autocomplete="off">
      <div class="search-bottle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="searchInput" type="search" inputmode="search" placeholder="Cerca canzoni, artisti, album…" />
        <button type="button" class="search-clear" id="clearBtn" aria-label="Cancella">✕</button>
      </div>
    </form>

    <div class="tag-row" id="tagRow">
      <div class="tag" data-q="lofi study">Lofi</div>
      <div class="tag" data-q="hit del momento italiane">Hit italiane</div>
      <div class="tag" data-q="pop internazionale 2026">Pop</div>
      <div class="tag" data-q="rap italiano">Rap ITA</div>
      <div class="tag" data-q="musica rilassante">Relax</div>
      <div class="tag" data-q="anni 2000 hit">Anni 2000</div>
    </div>

    <div class="state" id="state"></div>
    <div class="results" id="results"></div>
  </section>

  <section id="historyView" hidden>
    <div class="state" id="historyState"></div>
    <div class="results" id="historyResults"></div>
    <button class="clear-hist" id="clearHistBtn" type="button" hidden>🗑️ Svuota cronologia</button>
  </section>

</div>

<!-- mini player -->
<div class="player" id="player">
  <div class="player-inner">
    <div class="progress" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="player-row">
      <div class="vinyl" id="vinyl"><img src="" alt=""></div>
      <div class="player-meta">
        <div class="t" id="playerTitle">—</div>
        <div class="a" id="playerArtist">—</div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="Precedente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12l-8.5-6z"/></svg>
        </button>
        <button class="ctrl-btn ctrl-play" id="playBtn" aria-label="Play/Pausa">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Successivo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6v12l8.5-6z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- TRUCCO BACKGROUND ANDROID: Audio silenzioso in loop per mantenere attivo il processo -->
<audio id="bgKeeper" loop preload="auto" style="display:none;" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

<!-- player YouTube nascosto (audio) -->
<div id="yt-player-host"></div>

<script src="config.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js"></script>
<script>
  // Registrazione Service Worker per PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }

  // LOGICA BACKGROUND ANDROID
  // Avvia l'audio silenzioso al primo tocco sullo schermo per sbloccare i permessi di Android
  document.addEventListener('pointerdown', function initAudio() {
    const bgAudio = document.getElementById('bgKeeper');
    if (bgAudio.paused) {
      bgAudio.volume = 0.01; // Volume minimo per sicurezza
      bgAudio.play().catch(() => {}); // Ignora eventuali errori se il browser blocca
    }
    // Rimuove l'evento dopo il primo avvio per non appesantire l'app
    document.removeEventListener('pointerdown', initAudio);
  }, { once: true });
</script>
</body>
</html>
