<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AliceMusic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="searchView" class="view">
    <div class="top-bar">
      <h1>AliceMusic</h1>
      <button id="tabHistoryBtn" class="tab-btn">Cronologia 📜</button>
    </div>

    <form id="searchForm" class="search-box">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Cerca brani, artisti, playlist..." autocomplete="off">
        <button type="button" id="clearBtn" class="clear-btn" aria-label="Cancella">✕</button>
      </div>
    </form>

    <div id="typeFilter" class="type-filter">
      <button class="type-btn active" data-type="song">Brani</button>
      <button class="type-btn" data-type="artist">Artisti</button>
      <button class="type-btn" data-type="playlist">Playlist</button>
      <button class="type-btn" data-type="album">Album</button>
    </div>

    <div class="tags" id="tagRow">
      <button class="tag" data-q="Lofi">Lofi</button>
      <button class="tag" data-q="Hit italiane">Hit italiane</button>
      <button class="tag" data-q="Pop">Pop</button>
      <button class="tag" data-q="Rap ITA">Rap ITA</button>
      <button class="tag" data-q="Relax">Relax</button>
      <button class="tag" data-q="Anni 2000">Anni 2000</button>
    </div>

    <div id="state" class="state-container"></div>
    <div id="results" class="results-list"></div>
  </div>

  <div id="historyView" class="view" hidden>
    <div class="top-bar">
      <h1>Cronologia</h1>
      <button id="tabSearchBtn" class="tab-btn active">Cerca 🔍</button>
    </div>
    <div style="padding: 10px 16px; display: flex; justify-content: flex-end;">
      <button id="clearHistBtn" class="clear-hist-btn" hidden>Svuota cronologia</button>
    </div>
    <div id="historyState" class="state-container"></div>
    <div id="historyResults" class="results-list"></div>
  </div>

  <!-- Mini Player in basso -->
  <div id="player" class="player-bar">
    <div id="vinyl" class="vinyl">
      <img src="" alt="Cover">
    </div>
    <div class="meta">
      <div id="playerTitle" class="title">Titolo</div>
      <div id="playerArtist" class="artist">Artista</div>
    </div>
    <div class="controls">
      <button id="prevBtn" aria-label="Precedente">⏮</button>
      <button id="playBtn" aria-label="Play/Pause">▶</button>
      <button id="nextBtn" aria-label="Successivo">⏭</button>
    </div>
    <div id="progressBar" class="progress">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <!-- Player Fullscreen per la riproduzione -->
  <div id="fullscreenPlayer" class="fullscreen-player">
    <button id="fsCloseBtn" class="fs-close">↓</button>
    <div id="fsCover" class="fs-vinyl spin">
      <img src="" alt="Cover">
    </div>
    <div class="fs-meta">
      <div id="fsTitle" class="fs-title">Titolo</div>
      <div id="fsArtist" class="fs-artist">Artista</div>
    </div>
    <div id="fsProgressBar" class="progress fs-progress">
      <div id="fsProgressFill" class="progress-fill"></div>
    </div>
    <div class="fs-times">
      <span id="fsTimeCurrent">0:00</span>
      <span id="fsTimeDuration">0:00</span>
    </div>
    <div class="fs-controls">
      <button id="fsPrevBtn" aria-label="Precedente">⏮</button>
      <button id="fsPlayBtn" aria-label="Play/Pause">▶</button>
      <button id="fsNextBtn" aria-label="Successivo">⏭</button>
    </div>
  </div>

  <!-- Schermata Fullscreen Artista (Aggiunta per gestire gli artisti) -->
  <div id="artistModal" class="fullscreen-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-main, #121212); z-index:9999; overflow-y:auto; padding:20px; box-sizing:border-box;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <button id="closeArtistModal" style="background:none; border:none; color:var(--text-main, #fff); font-size:18px; cursor:pointer;">← Indietro</button>
      <h2 id="artistModalName" style="color:var(--gold, #d4af37); margin:0; font-size:20px;">Artista</h2>
      <div style="width:50px;"></div>
    </div>
    <div id="artistModalContent" style="display:flex; flex-direction:column; gap:10px;"></div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Host invisibile per YouTube IFrame API -->
  <div style="display:none;"><div id="yt-player-host"></div></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
