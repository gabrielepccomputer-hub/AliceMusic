<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AliceMusic ✨</title>

  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
</head>
<body>

  <!-- Polverina magica di sfondo -->
  <div class="dust" id="dust"></div>

  <!-- Contenitore Principale -->
  <div class="app">

    <!-- Header con Titolo e Tab -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">✨</span>
        <h1>AliceMusic</h1>
      </div>
      <p class="subtitle">Il tuo grimorio musicale incantato</p>

      <!-- Navigazione Tab -->
      <div class="tabs">
        <button id="tabSearchBtn" class="tab-btn active">🔍 Ricerca</button>
        <button id="tabHistoryBtn" class="tab-btn">📜 Cronologia</button>
      </div>
    </header>

    <!-- VISTA RICERCA -->
    <div id="searchView" class="view">
      <div class="search-box">
        <form id="searchForm" autocomplete="off">
          <div class="input-wrap">
            <input type="text" id="searchInput" placeholder="Cerca una canzone, un artista..." />
            <button type="button" id="clearBtn" class="clear-btn" aria-label="Cancella">×</button>
          </div>
        </form>
      </div>

      <!-- Tag Rapidi -->
      <div class="tag-row" id="tagRow">
        <button class="tag" data-q="Lo-Fi Beats">☕ Lo-Fi</button>
        <button class="tag" data-q="Anime Ost">🌸 Anime</button>
        <button class="tag" data-q="Epic Fantasy Music">🛡️ Fantasy</button>
        <button class="tag" data-q="Relaxing Piano">🎹 Piano</button>
        <button class="tag" data-q="Nightcore">⚡ Nightcore</button>
      </div>

      <!-- Stato iniziale / Risultati -->
      <div id="state" class="state-box"></div>
      <div id="results" class="results-list"></div>
    </div>

    <!-- VISTA CRONOLOGIA -->
    <div id="historyView" class="view" hidden>
      <div class="history-header">
        <h2>Cronologia Ascolti</h2>
        <button id="clearHistBtn" class="secondary-btn" hidden>Svuota</button>
      </div>
      <div id="historyState" class="state-box"></div>
      <div id="historyResults" class="results-list"></div>
    </div>

  </div>

  <!-- PLAYER FISSO IN BASSO -->
  <div id="player" class="player-panel">
    <div class="player-inner">
      <div id="vinyl" class="vinyl">
        <img src="" alt="Album Art">
        <div class="vinyl-center"></div>
      </div>
      <div class="player-meta">
        <div id="playerTitle" class="p-title">Titolo Canzone</div>
        <div id="playerArtist" class="p-artist">Artista</div>
      </div>
      <div class="player-controls">
        <button id="prevBtn" class="ctrl-btn" aria-label="Precedente">⏮</button>
        <button id="playBtn" class="ctrl-btn play-main" aria-label="Riproduci/Pausa">▶</button>
        <button id="nextBtn" class="ctrl-btn" aria-label="Successivo">⏭</button>
      </div>
    </div>
    <!-- Barra di avanzamento -->
    <div id="progressBar" class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <!-- Contenitore Nascosto per YouTube IFrame API -->
  <div id="yt-player-host" style="display:none;"></div>

  <!-- Toast notifiche -->
  <div id="toast" class="toast"></div>

  <!-- Script YouTube Ufficiale -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- Script principale della logica -->
  <script src="app.js" defer></script>
</body>
</html>
